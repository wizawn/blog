baseURL = 'https://blog.caowo.de/'
languageCode = 'zh-cn'
defaultContentLanguage = 'zh-cn'
hasCJKLanguage = true
title = "言零的博客"
theme = 'stack'
contentDir = 'source'
enableRobotsTXT = true
enableFuturePages = true
buildFuture = true
timeZone = 'UTC'

[params]
  # 允许发布未来日期的文章
  enableFuturePages = true

  # 文章排序：weight（教程置顶）
  SortBy = "weight"

  description = '专注于 Web 渗透测试、客户端逆向（Frida / BillingClient / StoreKit）、Stripe 支付风控协议分析、CVE 漏洞复现与 AI 工程排坑的一手实测笔记。'
  favicon = '/favicon.svg'

  # 自动配图配置
  [params.cover]
    autoAssign = false
    images = [
      "/images/og-default.png"
    ]
  mainSections = ["posts"]
  defaultImage = ''

  [params.header]
    title = '言零的博客'

  [params.footer]
    since = 2026

  # SEO 配置
  [params.seo]
    title = '言零的博客 | Web 渗透、客户端逆向、支付风控与协议分析'
    description = '专注于 Web 渗透测试、CVE 漏洞复现、移动端与内购逆向（Frida / BillingClient / StoreKit）、Stripe 支付状态机审计与 Codex 工程排坑的实战技术博客。'
    keywords = ['Web 渗透测试', '漏洞复现', '客户端逆向', '支付风控', '协议分析', 'Frida', 'StoreKit', 'Stripe', 'Nuclei', 'SQLMap', 'CVE', 'Codex']
    author = '言零'
    indexNowKey = 'b7e4c9a1d2f84e6093a5c1d7e8f02468'

  # Open Graph / 社交媒体分享
  [params.opengraph]
    title = '言零的博客'
    description = '专注于 Web 渗透测试、客户端逆向、支付风控协议分析与 CVE 漏洞复现的一手实测笔记。'
    image = '/images/og-default.png'
    [params.opengraph.twitter]
      card = 'summary_large_image'

  # Cloudflare Web Analytics
  [params.cloudflareAnalytics]
    enabled = true
    token = "SDZvDCIq-3er2UKht5fIrl2UvvIrJxi6hZVxBfIa"

  # Google Analytics 4 - blog.caowo.de
  [params.googleAnalytics]
    enabled = true
    id = "G-M3JN483VK6"

  # 百度统计 - blog.caowo.de
  [params.baiduAnalytics]
    enabled = true
    id = "459a34335680d2c2b91885b9497df7ff"

  # Google AdSense
  [params.adsense]
    enabled = true
    client = "ca-pub-2336550233412374"

  [params.comments]
    enabled = false

  # Widgets
  [[params.widgets.page]]
    type = "toc"

  [[params.widgets.homepage]]
    type = "archives"
    [params.widgets.homepage.params]
      limit = 5

  [[params.widgets.homepage]]
    type = "tag-cloud"
    [params.widgets.homepage.params]
      limit = 20

[related]
  includeNewer = true
  threshold = 20
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 80
  [[related.indices]]
    name = "categories"
    weight = 50
  [[related.indices]]
    name = "date"
    weight = 10

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    codeFences = true
    guessSyntax = false
    lineNos = false
    noClasses = false

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "文章"
    url = "/posts/"
    weight = 1

  [[menu.main]]
    identifier = "feeds"
    name = "资讯"
    url = "/feeds/"
    weight = 10
    [menu.main.params]
      icon = "rss"

  [[menu.main]]
    identifier = "archives"
    name = "归档"
    url = "/archives/"
    weight = 20
    [menu.main.params]
      icon = "archives"

  [[menu.main]]
    identifier = "categories"
    name = "分类"
    url = "/categories/"
    weight = 30
    [menu.main.params]
      icon = "categories"

  [[menu.main]]
    identifier = "tags"
    name = "标签"
    url = "/tags/"
    weight = 40
    [menu.main.params]
      icon = "tag"

  [[menu.main]]
    identifier = "links"
    name = "友链"
    url = "/links/"
    weight = 50
    [menu.main.params]
      icon = "link"

  [[menu.main]]
    identifier = "about"
    name = "关于"
    url = "/about/"
    weight = 55
    [menu.main.params]
      icon = "user"

  [[menu.main]]
    identifier = "search"
    name = "搜索"
    url = "/search/"
    weight = 60
    [menu.main.params]
      icon = "search"

# 首页与分页配置
[pagination]
  pagerSize = 10

[mediaTypes]
  [mediaTypes."text/llms"]
    suffixes = ["txt"]
  [mediaTypes."text/llmsfull"]
    suffixes = ["txt"]

[outputFormats]
  [outputFormats.LLMS]
    mediaType = "text/llms"
    baseName = "llms"
    isPlainText = true
    notAlternative = true
  [outputFormats.LLMSFULL]
    mediaType = "text/llmsfull"
    baseName = "llms-full"
    isPlainText = true
    notAlternative = true

[outputs]
  home = ["HTML", "RSS", "JSON", "LLMS", "LLMSFULL"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[params.sidebar]
  compact = false
  subtitle = "Web 渗透、客户端逆向、支付风控与协议分析笔记。"

[params.article]
  math = false
  toc = true
  readingTime = true

[params.article.license]
