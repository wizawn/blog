baseURL = 'https://blog.caowo.de/'
languageCode = 'zh-cn'
defaultContentLanguage = 'zh-cn'
hasCJKLanguage = true
title = "言零的博客"
theme = 'stack'
contentDir = 'source'
paginate = 10
enableFuturePages = true
buildFuture = true
timeZone = 'UTC'

[params]
  # 允许发布未来日期的文章
  enableFuturePages = true
  
  # 文章排序：weight（教程置顶）
  SortBy = "weight"
  
  description = '专注于 Web 渗透测试、漏洞复现与安全防御技术分享'
  
  # 自动配图配置
  [params.cover]
    # 使用随机封面图（从 static/ 目录随机选择）
    autoAssign = false
    images = [
      "/security-cover.jpg",
      "/tech-cover-1.jpg",
      "/blog-cover-default.jpg"
    ]
  mainSections = ["posts"]
  defaultImage = ''
  
  [params.header]
    title = '言零的博客'
    
  [params.footer]
    since = 2026
    
  # SEO 配置
  [params.seo]
    title = '言零的博客'
    description = '专注于 Web 渗透测试、漏洞复现、SRC 挖洞与安全防御技术分享。提供 Nuclei 教程、SQLMap 指南、CVE 漏洞复现等实战内容。'
    keywords = ['Web 渗透测试', '漏洞复现', 'SRC 挖洞', '网络安全', 'Nuclei', 'SQLMap', 'CVE', '安全研究']
    author = '言零'
    
  # Open Graph / 社交媒体分享
  [params.opengraph]
    title = '言零的博客'
    description = '专注于 Web 渗透测试、漏洞复现与安全防御技术分享'
    image = ''
    
  # Cloudflare Web Analytics
  [params.cloudflareAnalytics]
    enabled = true
    token = "SDZvDCIq-3er2UKht5fIrl2UvvIrJxi6hZVxBfIa"
  
  # Google Analytics 4 - blog.caowo.de
  [params.googleAnalytics]
    enabled = true
    id = "G-M3JN483VK6"
  
  # Google Analytics 4 - blog.wizawn.com
  [params.googleAnalyticsWizawn]
    enabled = false
    id = "G-SPGY6F5H5M"
  
  # 百度统计 - blog.caowo.de
  [params.baiduAnalytics]
    enabled = true
    id = "459a34335680d2c2b91885b9497df7ff"
  
  # 百度统计 - blog.wizawn.com（备用域名）
  [params.baiduAnalyticsWizawn]
    enabled = false
    id = "af4b0bac159ccbc7fec135fb16d457d5"
  
  # Google AdSense
  [params.adsense]
    enabled = true
    client = "ca-pub-2336550233412374"

  [params.comments]
    enabled = false

  # Widgets
  [[params.widgets.page]]
    type = "toc"

  [[params.widgets.homepage]]
    type = "archives"
    [params.widgets.homepage.params]
      limit = 5

  [[params.widgets.homepage]]
    type = "tag-cloud"
    [params.widgets.homepage.params]
      limit = 20

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    codeFences = true
    guessSyntax = false
    lineNos = false
    noClasses = false

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "文章"
    url = "/posts/"
    weight = 1

  [[menu.main]]
    identifier = "feeds"
    name = "资讯"
    url = "/feeds/"
    weight = 10
    [menu.main.params]
      icon = "rss"

  [[menu.main]]
    identifier = "archives"
    name = "归档"
    url = "/archives/"
    weight = 20
    [menu.main.params]
      icon = "archives"

  [[menu.main]]
    identifier = "categories"
    name = "分类"
    url = "/categories/"
    weight = 30
    [menu.main.params]
      icon = "categories"

  [[menu.main]]
    identifier = "tags"
    name = "标签"
    url = "/tags/"
    weight = 40
    [menu.main.params]
      icon = "tag"

  [[menu.main]]
    identifier = "links"
    name = "友链"
    url = "/links/"
    weight = 50
    [menu.main.params]
      icon = "link"

  [[menu.main]]
    identifier = "about"
    name = "关于"
    url = "/about/"
    weight = 55
    [menu.main.params]
      icon = "user"

  [[menu.main]]
    identifier = "search"
    name = "搜索"
    url = "/search/"
    weight = 60
    [menu.main.params]
      icon = "search"

# 首页配置
[pagination]
pagerSize = 10

[outputs]
home = ["HTML", "RSS", "JSON"]

[params.sidebar]
  compact = false
  subtitle = "Web 渗透、客户端逆向、支付风控与协议分析笔记。"

[params.article]
  math = false
  toc = true
  readingTime = true

[params.article.license]
