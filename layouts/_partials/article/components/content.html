<section class="article-content">
  {{- $content := .Content -}}
  {{- if eq .Section "posts" -}}
    {{- $content -}}
    {{- partial "ads/post-footer-matrix.html" . -}}
  {{- else -}}
    {{- $content -}}
  {{- end -}}
</section>

<script>
  /* 为所有未标注语言的普通 <pre> 代码块补齐悬停「复制」按钮 */
  (function () {
    const pres = document.querySelectorAll(".article-content pre");
    pres.forEach(function (pre) {
      if (pre.closest(".highlight") || pre.parentElement.classList.contains("yl-pre-wrap")) return;
      const wrap = document.createElement("div");
      wrap.className = "yl-pre-wrap";
      pre.parentNode.insertBefore(wrap, pre);
      wrap.appendChild(pre);

      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "yl-copy-btn";
      btn.textContent = "复制";
      btn.addEventListener("click", function () {
        navigator.clipboard.writeText(pre.innerText).then(function () {
          btn.textContent = "已复制";
          setTimeout(function () { btn.textContent = "复制"; }, 1400);
        });
      });
      wrap.appendChild(btn);
    });
  })();
</script>
